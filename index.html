<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>osu! Profile</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Rajdhani:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="wrapper">
    <div class="glass-card">
      <div class="header">
        <img class="profile-pic" src="" alt="osu! avatar" />
        <h1 id="username">Loading...</h1>
        <a id="profile-link" href="#" target="_blank">View Full osu! Profile</a>
      </div>
      <div class="stats">
        <div class="stat-item"><span>🌍 Global Rank:</span> <strong id="rank">--</strong></div>
        <div class="stat-item"><span>💯 PP:</span> <strong id="pp">--</strong></div>
        <div class="stat-item"><span>🎯 Accuracy:</span> <strong id="accuracy">--</strong></div>
        <div class="stat-item"><span>🎮 Play Count:</span> <strong id="plays">--</strong></div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
